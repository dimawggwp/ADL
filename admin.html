<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель ADL</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  body { padding-bottom: 0; }
  .a-top { background: var(--dark); color: var(--on-dark); }
  .a-top .wrap { display: flex; align-items: center; gap: 20px; height: 64px; }
  .a-top img { height: 30px; }
  .a-top b { font-size: 16px; font-weight: 400; margin-right: auto; padding-left: 16px; border-left: 1px solid var(--line-d); }
  .a-top button, .a-top a { font-size: 14px; color: var(--on-dark2); }
  .a-top button:hover, .a-top a:hover { color: var(--on-dark); }
  .a-main { padding: 36px 0 80px; }
  .a-login { max-width: 420px; margin: 8vh auto; }
  .a-tabs { display: flex; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
  .a-tabs button { height: 48px; padding: 0 20px; font-size: 15px; font-weight: 400; color: var(--ink2); }
  .a-tabs button.is-on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 6px; background: var(--ink); color: var(--bg); font-size: 12px; }
  .a-grid { display: grid; grid-template-columns: 420px 1fr; gap: 32px; align-items: start; }
  .a-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 26px; }
  .a-card h2 { font-size: 26px; font-weight: 300; letter-spacing: -.03em; margin: 0 0 18px; }
  .drop { display: block; border-radius: 16px; border: 1px dashed rgba(23,21,19,.35); padding: 26px 16px; text-align: center; color: var(--ink2); font-size: 14px; cursor: pointer; transition: all .2s; margin-bottom: 12px; }
  .drop.is-over, .drop:hover { border-color: var(--ink); background: var(--bg); }
  .drop b { color: var(--ink); font-weight: 400; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .thumbs div { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--bg2); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; background: rgba(0,0,0,.65); color: #fff; font-size: 14px; line-height: 1; }
  .thumbs .cover, .thumbs .mk { position: absolute; left: 0; bottom: 0; right: 0; font-size: 10.5px; padding: 3px 6px; background: var(--ink); color: var(--bg); text-align: center; }
  .thumbs .mk { background: rgba(255,255,255,.88); color: var(--ink); cursor: pointer; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; margin: 16px 0; }
  .check input { width: 18px; height: 18px; accent-color: var(--ink); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .item { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .item img { aspect-ratio: 4/3; object-fit: cover; width: 100%; }
  .item-b { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .item-b small { color: var(--ink2); font-size: 12.5px; }
  .item-b b { font-size: 17px; font-weight: 400; }
  .item-b span { font-size: 13.5px; color: var(--ink2); }
  .item-act { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .item-act button { height: 40px; font-size: 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .item-act button:nth-child(2n) { border-right: 0; }
  .item-act button:nth-child(n+3) { border-bottom: 0; }
  .item-act button:hover { background: var(--bg2); }
  .item-act .del { color: var(--err); }
  .item.is-hidden { opacity: .55; }
  .leads { display: grid; gap: 12px; }
  .lead { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 10px 20px; }
  .lead.new { border-left: 3px solid var(--ink); }
  .lead h3 { margin: 0; font-size: 17px; font-weight: 400; }
  .lead h3 a { border-bottom: 1px solid var(--line); }
  .lead .meta { font-size: 13px; color: var(--ink2); }
  .lead pre { grid-column: 1 / -1; margin: 0; white-space: pre-wrap; font: 300 14px/1.55 var(--font); background: var(--bg); padding: 12px 14px; }
  .lead .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lead .b { height: 38px; padding: 0 14px; font-size: 13.5px; }
  .lead select { height: 38px; border-radius: 999px; border: 1px solid var(--line); padding: 0 10px; background: var(--paper); font: inherit; font-size: 13.5px; }
  .lead .proj { grid-column: 1 / -1; }
  .lead .proj img { max-width: 360px; width: 100%; }
  .muted { color: var(--ink2); }
  code { background: var(--bg2); padding: 2px 6px; font-size: 13px; word-break: break-all; }
  @media (max-width: 900px) { .a-grid { grid-template-columns: 1fr; } .lead { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="a-top"><div class="wrap">
  <img src="assets/img/logo-cream.png" alt="ADL"><b>Админ-панель</b>
  <a href="index.html" target="_blank">Открыть сайт ↗</a>
  <button id="logout" hidden>Выйти</button>
</div></header>

<main class="a-main wrap" id="app">
  <div class="a-login a-card" id="loginBox">
    <h2>Вход</h2>
    <p class="muted" style="margin:-8px 0 18px;font-size:14px">Для владельца и менеджеров ADL</p>
    <form id="loginForm">
      <label class="fld"><input id="lEmail" type="email" placeholder=" " autocomplete="username" required><span>Email</span></label>
      <label class="fld"><input id="lPass" type="password" placeholder=" " autocomplete="current-password" required><span>Пароль</span></label>
      <button class="b b--dark b--full" type="submit" style="margin-top:18px">Войти</button>
    </form>
  </div>

  <div id="panel" hidden>
    <div class="a-tabs">
      <button data-t="gallery" class="is-on">Галерея</button>
      <button data-t="leads">Заявки <span class="badge" id="newCount" hidden>0</span></button>
    </div>

    <section data-p="gallery">
      <div class="a-grid">
        <div class="a-card">
          <h2 id="formTitle">Новая работа</h2>
          <form id="itemForm">
            <label class="drop" id="drop"><input type="file" id="files" accept="image/*" multiple hidden>
              <b>Нажмите или перетащите фото</b><br>можно несколько, первое — обложка</label>
            <div class="thumbs" id="thumbs"></div>
            <label class="fld"><input id="iTitle" placeholder=" " required maxlength="120"><span>Название (например «Кухня Сканди»)</span></label>
            <label class="fld fld--sel"><select id="iCat"></select><span>Категория</span></label>
            <label class="fld"><input id="iPrice" placeholder=" " maxlength="80"><span>Цена (например «от 450 000 ₸»)</span></label>
            <label class="fld"><textarea id="iMat" placeholder=" " maxlength="500" rows="2"></textarea><span>Материалы (корпус, фасады, столешница)</span></label>
            <label class="fld"><textarea id="iMech" placeholder=" " maxlength="500" rows="2"></textarea><span>Механизмы и фурнитура</span></label>
            <div class="row2">
              <label class="fld"><input id="iDim" placeholder=" " maxlength="80"><span>Размеры</span></label>
              <label class="fld"><input id="iTime" placeholder=" " maxlength="60"><span>Срок</span></label>
            </div>
            <label class="fld"><textarea id="iDesc" placeholder=" " maxlength="2000"></textarea><span>Описание</span></label>
            <label class="check"><input type="checkbox" id="iPub" checked> Показывать на сайте</label>
            <button class="b b--dark b--full" type="submit" id="saveBtn">Опубликовать</button>
            <button class="b b--line b--full" type="button" id="cancelEdit" hidden style="margin-top:8px">Отменить редактирование</button>
          </form>
        </div>
        <div>
          <div class="items" id="items"></div>
        </div>
      </div>
    </section>

    <section data-p="leads" hidden>
      <div class="leads" id="leads"></div>
    </section>
  </div>
</main>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
